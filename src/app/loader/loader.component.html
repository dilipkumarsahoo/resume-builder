@if (isVisible()) {
<div #loaderContainer class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#fafafc] select-none">
  
  <!-- Soft Ambient Glow Matching Theme -->
  <div class="absolute w-96 h-96 bg-gradient-to-tr from-blue-100/50 via-indigo-100/30 to-sky-100/40 rounded-full blur-3xl pointer-events-none -z-10"></div>

  <!-- Brand Logo Unit -->
  <div class="flex flex-col items-center mb-8 relative">
    <!-- Ambient aura glow behind logo -->
    <div class="absolute -top-3 w-16 h-16 bg-blue-500/10 rounded-full blur-xl loader-glow pointer-events-none"></div>

    <div class="flex items-center gap-3">
      <div class="w-9 h-9 flex items-center justify-center">
        <svg viewBox="0 0 32 32" class="w-9 h-9" fill="currentColor">
          <path d="M6 10 C 10 6, 16 6, 20 10 L 14 16 C 12 14, 8 14, 6 16 Z" fill="#4338ca" />
          <path d="M12 16 C 16 12, 22 12, 26 16 L 20 22 C 18 20, 14 20, 12 22 Z" fill="#2563eb" />
          <path d="M18 22 C 22 18, 28 18, 32 22 L 26 28 C 24 26, 20 26, 18 28 Z" fill="#60a5fa" />
        </svg>
      </div>

      <span class="text-2xl font-bold tracking-tight text-slate-900">
        GlowCV
      </span>
    </div>
  </div>

  <!-- Theme-based Gradient Progress Bar -->
  <div class="w-60 sm:w-64 h-1.5 bg-slate-200/80 rounded-full overflow-hidden p-px shadow-inner">
    <div #progressBar class="h-full bg-gradient-to-r from-[#4338ca] via-[#2563eb] to-[#60a5fa] w-0 rounded-full shimmer-bar relative"></div>
  </div>

  <!-- Subtle Loading Caption -->
  <p class="mt-4 text-xs font-medium text-slate-400 tracking-wider">
    Loading your workspace...
  </p>

</div>
}
