@if (isVisible()) {
<div #loaderContainer class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white">
  <div class="flex items-center gap-3 mb-8 cursor-pointer">
    <div class="w-8 h-8 rounded-lg overflow-hidden">
      <img src="../assets/logo.png" alt="GlowCV Logo" class="w-full h-full object-contain" />
    </div>

    <span class="text-2xl font-semibold tracking-tight text-text-main">
      GlowCV
    </span>
  </div>
  <div class="w-64 h-1 bg-bg-light rounded-full overflow-hidden">
    <div #progressBar class="h-full bg-accent w-0 rounded-full"></div>
  </div>
</div>
}
