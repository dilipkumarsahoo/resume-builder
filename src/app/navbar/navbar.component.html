<header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [ngClass]="isScrolled() ? 'bg-white/90 backdrop-blur-xl border-b border-slate-200/80 shadow-xs py-3' : 'bg-white/70 backdrop-blur-md border-b border-slate-100/80 py-4'">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between gap-4">

      <!-- Brand Logo -->
      <a routerLink="/" (click)="closeMobileMenu()" class="flex items-center gap-2.5 group cursor-pointer select-none">
        <div
          class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-600 p-0.5 shadow-sm shadow-emerald-500/20 group-hover:scale-105 transition-transform duration-200">
          <div class="w-full h-full bg-white rounded-[10px] overflow-hidden flex items-center justify-center p-1">
            <img src="../assets/logo.png" alt="GlowCV Logo" class="w-full h-full object-contain" />
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          <span
            class="text-xl font-extrabold tracking-tight text-slate-900 group-hover:text-emerald-600 transition-colors">
            GlowCV
          </span>
          <span
            class="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded-md bg-emerald-100 text-emerald-700 font-mono">
            AI
          </span>
        </div>
      </a>

      <!-- Desktop Navigation Center Links -->
      <nav class="hidden lg:flex items-center gap-1 bg-slate-100/60 p-1 rounded-full border border-slate-200/60">
        <button (click)="openResumeBuilder()"
          class="px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-white hover:shadow-xs transition-all cursor-pointer flex items-center gap-1.5">
          <span class="material-icons text-emerald-500 text-base">auto_awesome</span>
          Resume Builder
        </button>

        <button (click)="openResumeTemplates()"
          class="px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-white hover:shadow-xs transition-all cursor-pointer">
          Templates
        </button>

        <a routerLink="/cover-letter"
          class="px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-white hover:shadow-xs transition-all">
          Cover Letter
        </a>

        <a routerLink="/pricing"
          class="px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-white hover:shadow-xs transition-all">
          Pricing
        </a>

        <a routerLink="/about"
          class="px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-white hover:shadow-xs transition-all">
          About
        </a>
      </nav>

      <!-- Desktop Right Action Buttons -->
      <div class="hidden sm:flex items-center gap-3">
        <button routerLink="/login"
          class="text-sm font-semibold text-slate-700 hover:text-slate-900 px-4 py-2 hover:bg-slate-100 rounded-full transition-all cursor-pointer">
          Log in
        </button>

        <button (click)="openResumeBuilder()"
          class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-semibold text-sm px-5 py-2.5 rounded-full shadow-md shadow-emerald-500/20 hover:shadow-lg hover:shadow-emerald-500/30 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center gap-1.5 cursor-pointer">
          <span>Create CV</span>
          <span class="material-icons text-sm">arrow_forward</span>
        </button>
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="flex lg:hidden items-center gap-2">
        <button (click)="openResumeBuilder()"
          class="sm:hidden bg-emerald-600 text-white font-semibold text-xs px-3.5 py-1.5 rounded-full shadow-xs">
          Create CV
        </button>

        <button (click)="toggleMobileMenu()"
          class="p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors focus:outline-none"
          aria-label="Toggle Navigation Menu">
          <span class="material-icons text-2xl">
            {{ mobileMenuOpen() ? 'close' : 'menu' }}
          </span>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Drawer / Menu -->
  <div *ngIf="mobileMenuOpen()"
    class="lg:hidden bg-white/95 backdrop-blur-2xl border-b border-slate-200 px-6 py-6 shadow-xl animate-modal-enter">
    <div class="flex flex-col space-y-3">
      <button (click)="openResumeBuilder()"
        class="flex items-center gap-3 w-full text-left px-4 py-3 rounded-xl font-semibold text-slate-800 hover:bg-emerald-50 hover:text-emerald-700 transition-colors">
        <span class="material-icons text-emerald-600">auto_awesome</span>
        <span>Resume Builder</span>
      </button>

      <button (click)="openResumeTemplates()"
        class="flex items-center gap-3 w-full text-left px-4 py-3 rounded-xl font-semibold text-slate-800 hover:bg-slate-50 transition-colors">
        <span class="material-icons text-slate-500">grid_view</span>
        <span>Resume Templates</span>
      </button>

      <a routerLink="/cover-letter" (click)="closeMobileMenu()"
        class="flex items-center gap-3 w-full text-left px-4 py-3 rounded-xl font-semibold text-slate-800 hover:bg-slate-50 transition-colors">
        <span class="material-icons text-slate-500">description</span>
        <span>Cover Letter</span>
      </a>

      <a routerLink="/pricing" (click)="closeMobileMenu()"
        class="flex items-center gap-3 w-full text-left px-4 py-3 rounded-xl font-semibold text-slate-800 hover:bg-slate-50 transition-colors">
        <span class="material-icons text-slate-500">sell</span>
        <span>Pricing</span>
      </a>

      <a routerLink="/about" (click)="closeMobileMenu()"
        class="flex items-center gap-3 w-full text-left px-4 py-3 rounded-xl font-semibold text-slate-800 hover:bg-slate-50 transition-colors">
        <span class="material-icons text-slate-500">info</span>
        <span>About</span>
      </a>

      <div class="pt-4 border-t border-slate-100 flex flex-col gap-2.5">
        <button routerLink="/login" (click)="closeMobileMenu()"
          class="w-full py-3 rounded-xl font-semibold text-sm text-slate-700 border border-slate-200 hover:bg-slate-50 transition-colors">
          Log in
        </button>

        <button (click)="openResumeBuilder()"
          class="w-full py-3 rounded-xl font-semibold text-sm bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-md shadow-emerald-500/20 text-center">
          Create CV Free
        </button>
      </div>
    </div>
  </div>
</header>
