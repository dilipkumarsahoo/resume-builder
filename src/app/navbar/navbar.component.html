<header class="fixed top-0 left-0 right-0 z-50 transition-all duration-200"
  [ngClass]="isScrolled() ? 'bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-xs py-3' : 'bg-[#fafafc]/90 backdrop-blur-sm border-b border-transparent py-4'">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between">

      <!-- Brand Logo (Builder.io style with wave logo icon) -->
      <a routerLink="/" (click)="closeMobileMenu()" class="flex items-center gap-2.5 group cursor-pointer select-none">
        <div class="w-7 h-7 flex items-center justify-center">
          <svg viewBox="0 0 32 32" class="w-6 h-6 text-[#2563eb]" fill="currentColor">
            <path d="M6 10 C 10 6, 16 6, 20 10 L 14 16 C 12 14, 8 14, 6 16 Z" fill="#4338ca" />
            <path d="M12 16 C 16 12, 22 12, 26 16 L 20 22 C 18 20, 14 20, 12 22 Z" fill="#2563eb" />
            <path d="M18 22 C 22 18, 28 18, 32 22 L 26 28 C 24 26, 20 26, 18 28 Z" fill="#60a5fa" />
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight text-slate-900 group-hover:text-blue-600 transition-colors">
          GlowCV
        </span>
      </a>

      <!-- Desktop Center Navigation Links -->
      <nav class="hidden md:flex items-center gap-8 text-[15px] font-medium text-slate-800">

        <!-- Tools Dropdown Menu -->
        <div class="relative group" (mouseleave)="closeToolsDropdown()">
          <button (click)="toggleToolsDropdown($event)" (mouseenter)="openToolsDropdown()"
            class="flex items-center gap-1.5 py-1 text-slate-800 hover:text-blue-600 transition-colors cursor-pointer select-none">
            <span>Tools</span>
            <svg class="w-3.5 h-3.5 text-slate-500 transition-transform duration-200"
              [ngClass]="toolsDropdownOpen() ? 'rotate-180 text-blue-600' : ''" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <!-- Dropdown Popover Card -->
          <div *ngIf="toolsDropdownOpen()"
            class="absolute top-full left-1/2 -translate-x-1/2 pt-2 z-50 animate-modal-enter w-64">
            <div class="bg-white rounded-2xl p-2 shadow-xl border border-slate-100 ring-1 ring-slate-900/5">

              <!-- 1. Resume Templates -->
              <button (click)="openResumeTemplates()"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left hover:bg-slate-50 group/item transition-colors cursor-pointer">
                <div
                  class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center group-hover/item:bg-blue-600 group-hover/item:text-white transition-colors">
                  <span class="material-icons text-lg">description</span>
                </div>
                <div>
                  <p class="text-sm font-semibold text-slate-800 group-hover/item:text-blue-600 transition-colors">
                    Resume Templates</p>
                  <p class="text-[11px] text-slate-400">Professional ATS layouts</p>
                </div>
              </button>

              <!-- 2. Cover Letter -->
              <button (click)="openCoverLetter()"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left hover:bg-slate-50 group/item transition-colors cursor-pointer">
                <div
                  class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover/item:bg-indigo-600 group-hover/item:text-white transition-colors">
                  <span class="material-icons text-lg">edit_note</span>
                </div>
                <div>
                  <p class="text-sm font-semibold text-slate-800 group-hover/item:text-blue-600 transition-colors">Cover
                    Letter</p>
                  <p class="text-[11px] text-slate-400">AI letter generator & editor</p>
                </div>
              </button>

              <!-- 3. Job Tracker -->
              <button (click)="openJobTracker()"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left hover:bg-slate-50 group/item transition-colors cursor-pointer">
                <div
                  class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center group-hover/item:bg-emerald-600 group-hover/item:text-white transition-colors">
                  <span class="material-icons text-lg">work_outline</span>
                </div>
                <div>
                  <p class="text-sm font-semibold text-slate-800 group-hover/item:text-blue-600 transition-colors">Job
                    Tracker</p>
                  <p class="text-[11px] text-slate-400">Track saved jobs & applications</p>
                </div>
              </button>

            </div>
          </div>
        </div>

        <!-- Pricing Link -->
        <a routerLink="/pricing" class="text-slate-800 hover:text-blue-600 transition-colors cursor-pointer py-1">
          Pricing
        </a>

        <!-- FAQ's Link -->
        <a routerLink="/about" class="text-slate-800 hover:text-blue-600 transition-colors cursor-pointer py-1">
          FAQ's
        </a>

      </nav>

      <!-- Desktop Right Action Buttons (Log In & Get Started) -->
      <div class="hidden sm:flex items-center gap-4">
        <a routerLink="/login"
          class="text-sm font-semibold text-slate-800 hover:text-blue-600 px-3 py-2 transition-colors cursor-pointer">
          Log In
        </a>

        <button (click)="openGetStarted()"
          class="border border-slate-900 hover:bg-slate-900 hover:text-white text-slate-900 text-sm font-semibold px-5 py-2 rounded-xl transition-all duration-200 cursor-pointer shadow-2xs hover:shadow-xs active:scale-98">
          Get Started
        </button>
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="flex md:hidden items-center gap-2">
        <button (click)="openGetStarted()"
          class="text-xs font-semibold px-3 py-1.5 border border-slate-900 rounded-lg text-slate-900 hover:bg-slate-900 hover:text-white transition-all">
          Get Started
        </button>

        <button (click)="toggleMobileMenu()"
          class="p-2 rounded-xl text-slate-700 hover:text-slate-900 hover:bg-slate-100 transition-colors focus:outline-none"
          aria-label="Toggle Navigation Menu">
          <span class="material-icons text-2xl">
            {{ mobileMenuOpen() ? 'close' : 'menu' }}
          </span>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Drawer / Menu -->
  <div *ngIf="mobileMenuOpen()"
    class="md:hidden bg-white/98 backdrop-blur-2xl border-b border-slate-200 px-6 py-5 shadow-xl animate-modal-enter">
    <div class="flex flex-col space-y-3">

      <!-- Mobile Tools Dropdown Accordion -->
      <div>
        <button (click)="toggleMobileTools()"
          class="flex items-center justify-between w-full text-left px-3 py-2.5 rounded-xl font-semibold text-slate-800 hover:bg-slate-50 transition-colors">
          <span>Tools</span>
          <svg class="w-4 h-4 text-slate-500 transition-transform duration-200"
            [ngClass]="mobileToolsOpen() ? 'rotate-180 text-blue-600' : ''" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>

        <div *ngIf="mobileToolsOpen()" class="pl-4 space-y-1.5 mt-1 border-l-2 border-slate-100 ml-3">
          <button (click)="openResumeTemplates()"
            class="flex items-center gap-2.5 w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:text-blue-600 hover:bg-slate-50 transition-colors">
            <span class="material-icons text-base text-blue-500">description</span>
            <span>Resume Templates</span>
          </button>

          <button (click)="openCoverLetter()"
            class="flex items-center gap-2.5 w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:text-blue-600 hover:bg-slate-50 transition-colors">
            <span class="material-icons text-base text-indigo-500">edit_note</span>
            <span>Cover Letter</span>
          </button>

          <button (click)="openJobTracker()"
            class="flex items-center gap-2.5 w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-700 hover:text-blue-600 hover:bg-slate-50 transition-colors">
            <span class="material-icons text-base text-emerald-500">work_outline</span>
            <span>Job Tracker</span>
          </button>
        </div>
      </div>

      <!-- Pricing -->
      <a routerLink="/pricing" (click)="closeMobileMenu()"
        class="block px-3 py-2.5 rounded-xl font-semibold text-slate-800 hover:bg-slate-50 transition-colors">
        Pricing
      </a>

      <!-- FAQ's -->
      <a routerLink="/about" (click)="closeMobileMenu()"
        class="block px-3 py-2.5 rounded-xl font-semibold text-slate-800 hover:bg-slate-50 transition-colors">
        FAQ's
      </a>

      <div class="pt-4 border-t border-slate-100 flex flex-col gap-2.5">
        <a routerLink="/login" (click)="closeMobileMenu()"
          class="w-full py-2.5 rounded-xl font-semibold text-sm text-center text-slate-800 border border-slate-200 hover:bg-slate-50 transition-colors">
          Log In
        </a>

        <button (click)="openGetStarted()"
          class="w-full py-2.5 rounded-xl font-semibold text-sm bg-slate-900 text-white text-center hover:bg-slate-800 transition-colors">
          Get Started
        </button>
      </div>

    </div>
  </div>
</header>
