<section class="py-24 bg-white" #section>
  <div class="max-w-7xl mx-auto px-6">
    <div class="text-center mb-16">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-green-50 text-sm font-medium text-green-700 mb-4 opacity-0 translate-y-4" #trustBadge>
        <span class="material-icons text-sm">star</span> Trustpilot
      </div>
      <h2 class="text-3xl md:text-5xl font-bold tracking-tight text-text-main mb-4 opacity-0 translate-y-4" #heading>
        Trusted by recruiters and <br/> job-seekers around the world.
      </h2>
      <p class="text-xl text-gray-500 opacity-0 translate-y-4" #subheading>Users got the job on average 48 days faster.*</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 max-w-4xl mx-auto" #photoGrid>
      @for (i of [1,2,3,4,5,6,7,8]; track $index) {
        <div class="aspect-square rounded-2xl overflow-hidden relative group cursor-pointer photo-item opacity-0 scale-95">
          <img [src]="'https://picsum.photos/seed/person' + i + '/400/400'" alt="User" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" referrerpolicy="no-referrer" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
            <div class="flex text-yellow-400 text-sm">
              <span class="material-icons text-sm">star</span>
              <span class="material-icons text-sm">star</span>
              <span class="material-icons text-sm">star</span>
              <span class="material-icons text-sm">star</span>
              <span class="material-icons text-sm">star</span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
