<div class="min-h-screen bg-[#F9FAFB] font-sans">
  <!-- Top Navigation -->
  <nav class="sticky top-0 z-50 h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 md:px-10 shadow-sm">
    <div class="flex items-center gap-8">
       <!-- Logo -->
       <div class="flex items-center gap-2 cursor-pointer group" routerLink="/dashboard">
          <div class="w-8 h-8 bg-[#00C896] rounded-lg flex items-center justify-center text-white group-hover:rotate-6 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          </div>
          <span class="text-xl font-bold tracking-tight text-gray-900">Job Tracker</span>
       </div>

       <!-- Search Bar -->
       <div class="hidden md:flex items-center relative group">
         <svg class="absolute left-3 w-4 h-4 text-gray-400 group-focus-within:text-accent transition-colors" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
         <input type="text" placeholder="Search" class="pl-10 pr-4 py-1.5 bg-gray-100/80 border-none rounded-full text-sm focus:ring-2 focus:ring-accent/20 w-64 transition-all focus:bg-white focus:shadow-sm outline-none">
       </div>
    </div>

    <div class="flex items-center gap-6">
      <div class="hidden lg:flex items-center gap-5 text-sm font-semibold text-gray-500">
        <button class="flex items-center gap-1.5 hover:text-gray-900 transition-colors">
          All Statuses 
          <svg class="w-4 h-4 opacity-50" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
        </button>
        <div class="w-px h-4 bg-gray-200"></div>
        <button class="flex items-center gap-1.5 hover:text-gray-900 transition-colors">
          <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2m0 10V7" /></svg>
          Columns 
          <svg class="w-4 h-4 opacity-50" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
        </button>
        <button class="flex items-center gap-1.5 hover:text-gray-900 transition-colors">
          <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" /></svg>
          View Statistics 
          <svg class="w-4 h-4 opacity-50" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
        </button>
      </div>

      <button class="px-5 py-2.5 bg-[#6366F1] text-white rounded-xl text-sm font-bold shadow-lg shadow-indigo-200 hover:bg-[#5558E3] hover:scale-[1.02] active:scale-95 transition-all flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Job Application
      </button>

      <button class="text-sm font-bold text-gray-400 hover:text-gray-900 flex items-center gap-1.5 transition-colors">
        Menu 
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z" /></svg>
      </button>
    </div>
  </nav>

  <!-- Table Section -->
  <div class="p-8">
    <div class="bg-white border border-gray-200 rounded-[20px] overflow-hidden shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50/50 border-b border-gray-100">
              <th class="p-5 w-12"><input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-accent focus:ring-accent"></th>
              <th class="p-5 text-[11px] font-black text-gray-400 uppercase tracking-[0.1em]">Position</th>
              <th class="p-5 text-[11px] font-black text-gray-400 uppercase tracking-[0.1em]">Company</th>
              <th class="p-5 w-10"></th>
              <th class="p-5 text-[11px] font-black text-gray-400 uppercase tracking-[0.1em]">Status</th>
              <th class="p-5 text-[11px] font-black text-gray-400 uppercase tracking-[0.1em]">Date Saved</th>
              <th class="p-5 text-[11px] font-black text-gray-400 uppercase tracking-[0.1em]">Date App...</th>
              <th class="p-5 text-[11px] font-black text-gray-400 uppercase tracking-[0.1em]">Type</th>
              <th class="p-5 text-[11px] font-black text-gray-400 uppercase tracking-[0.1em]">Resume</th>
              <th class="p-5 text-[11px] font-black text-gray-400 uppercase tracking-[0.1em]">Cover Letter</th>
              <th class="p-5 text-[11px] font-black text-gray-400 uppercase tracking-[0.1em]">Notes</th>
              <th class="p-5 w-10 text-gray-300">
                <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
              </th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-50">
            <tr *ngFor="let job of jobs" class="hover:bg-gray-50/50 transition-colors group">
              <td class="p-5"><input type="checkbox" class="w-4 h-4 rounded border-gray-300"></td>
              <td class="p-5">
                <span class="text-sm font-semibold text-gray-900" *ngIf="job.position">{{job.position}}</span>
                <span class="text-sm text-gray-300 italic font-medium" *ngIf="!job.position">Add Job Position</span>
              </td>
              <td class="p-5">
                <span class="text-sm font-semibold text-gray-500" *ngIf="job.company">{{job.company}}</span>
                <span class="text-sm text-gray-300 italic font-medium" *ngIf="!job.company">Add Company</span>
              </td>
              <td class="p-5">
                <button class="text-gray-300 hover:text-accent transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.828a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
                </button>
              </td>
              <td class="p-5">
                <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#E0D7FF] text-[#6366F1] font-bold text-xs cursor-pointer hover:bg-[#D4C9FF] transition-colors">
                  <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" /></svg>
                  {{job.status}}
                  <svg class="w-3.5 h-3.5 ml-0.5 opacity-60" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                </div>
              </td>
              <td class="p-5 text-sm font-medium text-gray-500">{{job.dateSaved}}</td>
              <td class="p-5">
                <button class="text-sm text-gray-300 hover:text-gray-500 font-medium italic flex items-center gap-1.5">
                   <span class="text-xl leading-none -mt-1">+</span> Date Appli...
                </button>
              </td>
              <td class="p-5">
                 <div class="inline-flex items-center justify-between gap-3 text-sm font-semibold text-gray-500 border border-gray-100 rounded-lg px-3 py-1.5 hover:border-gray-200 hover:bg-gray-50 cursor-pointer transition-all">
                   {{job.type}}
                   <svg class="w-4 h-4 opacity-40" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                 </div>
              </td>
              <td class="p-5">
                <button class="text-sm text-gray-300 hover:text-gray-500 font-medium italic flex items-center gap-1.5">
                   <span class="text-xl leading-none -mt-1">+</span> Resume
                </button>
              </td>
              <td class="p-5">
                <button class="text-sm text-gray-300 hover:text-gray-500 font-medium italic flex items-center gap-1.5">
                   <span class="text-xl leading-none -mt-1">+</span> Cover Letter
                </button>
              </td>
              <td class="p-5">
                <button class="text-sm text-gray-300 hover:text-gray-500 font-medium italic group-hover:text-gray-400 transition-colors">
                  Write a note
                </button>
              </td>
              <td class="p-5"></td>
            </tr>
            
            <!-- Empty State / Add New Row Hint -->
            <tr class="group cursor-pointer">
              <td class="p-5 border-t border-gray-50"></td>
              <td class="p-5 border-t border-gray-50">
                <span class="text-sm text-gray-300 italic font-medium group-hover:text-accent transition-colors">Add Job Position</span>
              </td>
              <td class="p-5 border-t border-gray-50">
                <span class="text-sm text-gray-300 italic font-medium group-hover:text-accent transition-colors">Add Company</span>
              </td>
              <td colspan="9" class="p-5 border-t border-gray-50"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    
    <p class="mt-6 text-center text-xs font-bold text-gray-400 uppercase tracking-widest">
      Showing {{jobs.length}} of {{jobs.length}} saved jobs
    </p>
  </div>
</div>
